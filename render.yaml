# FairBatch web UI — static SPA on Render.
# Dashboard: New Blueprint → this repo, or New Static Site with the fields below.
# Contracts stay on Ethereum Sepolia. This service only serves frontend/dist.
services:
  - type: web
    name: fairbatch
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
